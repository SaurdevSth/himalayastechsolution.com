# Nginx site config for himalayastechsolution.com
# Copy to /etc/nginx/sites-available/himalayastechsolution.com
# Certbot will add the HTTPS (port 443) settings for you.

server {
    listen 80;
    listen [::]:80;
    server_name himalayastechsolution.com www.himalayastechsolution.com;

    root /var/www/himalayastechsolution.com;
    index index.html;

    # Pretty URLs: /seo -> /seo/ -> /seo/index.html
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Cache images, icons and fonts for 30 days
    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # HTML always fresh, so updates show right away
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Compression
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    # Basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
